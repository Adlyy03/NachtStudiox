<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="vectraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242429" />
      <stop offset="50%" stop-color="#18181c" />
      <stop offset="100%" stop-color="#0f0f12" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="#09090b" />
  <rect width="800" height="480" fill="url(#vectraGlow)" />

  <!-- Surrounding Context Panels -->
  <!-- Left Side: App Telemetry -->
  <rect x="50" y="80" width="220" height="320" rx="8" fill="#121216" stroke="rgba(255,255,255,0.08)" />
  <text x="70" y="115" fill="#777777" font-family="monospace" font-size="9" letter-spacing="1">SECURITY VAULT</text>
  <text x="70" y="145" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="600">Secure Enclave</text>
  <text x="70" y="165" fill="#888888" font-family="sans-serif" font-size="11">Hardware-level key pair derivation</text>

  <rect x="70" y="190" width="180" height="44" rx="6" fill="#18181e" stroke="rgba(255,255,255,0.06)" />
  <text x="85" y="210" fill="#666666" font-family="monospace" font-size="9">BIOMETRIC AUTH</text>
  <text x="85" y="225" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="500">FaceID / TouchID Passed</text>

  <rect x="70" y="245" width="180" height="44" rx="6" fill="#18181e" stroke="rgba(255,255,255,0.06)" />
  <text x="85" y="265" fill="#666666" font-family="monospace" font-size="9">TX CONFIRMATION</text>
  <text x="85" y="280" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="500">Sub-second Finality</text>

  <rect x="70" y="300" width="180" height="44" rx="6" fill="#18181e" stroke="rgba(255,255,255,0.06)" />
  <text x="85" y="320" fill="#666666" font-family="monospace" font-size="9">ENCRYPTION PROTOCOL</text>
  <text x="85" y="335" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="500">ChaCha20-Poly1305</text>

  <!-- Center Stage: Smartphone Mockup Chassis -->
  <rect x="310" y="25" width="220" height="430" rx="36" fill="#0d0d10" stroke="rgba(255,255,255,0.22)" stroke-width="2.5" />
  <!-- Screen Area -->
  <rect x="318" y="33" width="204" height="414" rx="28" fill="#121215" />

  <!-- Dynamic Island Notch -->
  <rect x="382" y="42" width="76" height="18" rx="9" fill="#000000" />
  <circle cx="445" cy="51" r="3" fill="#222222" />

  <!-- Phone Header -->
  <text x="335" y="85" fill="#666666" font-family="sans-serif" font-size="10">TOTAL NET WORTH</text>
  <text x="335" y="112" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">$248,910.45</text>
  <text x="335" y="128" fill="#44cc88" font-family="monospace" font-size="10">+$14,290.00 (+6.1%)</text>

  <!-- Tactile Metallic Virtual Card Inside Screen -->
  <rect x="330" y="145" width="180" height="110" rx="10" fill="url(#cardMetallic)" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
  <text x="345" y="168" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1">VECTRA</text>
  <text x="475" y="168" fill="#aaaaaa" font-family="monospace" font-size="8">BLACK</text>
  <rect x="345" y="185" width="22" height="16" rx="3" fill="rgba(255,255,255,0.2)" />
  <text x="345" y="235" fill="#888888" font-family="monospace" font-size="8">•••• 8912</text>
  <text x="460" y="235" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="600">EXP 08/29</text>

  <!-- Quick Action Buttons -->
  <rect x="330" y="270" width="55" height="32" rx="6" fill="#1c1c22" stroke="rgba(255,255,255,0.08)" />
  <text x="357" y="290" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Send</text>

  <rect x="392" y="270" width="55" height="32" rx="6" fill="#1c1c22" stroke="rgba(255,255,255,0.08)" />
  <text x="419" y="290" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Receive</text>

  <rect x="455" y="270" width="55" height="32" rx="6" fill="#1c1c22" stroke="rgba(255,255,255,0.08)" />
  <text x="482" y="290" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Swap</text>

  <!-- Recent Transaction Feed List -->
  <text x="335" y="325" fill="#777777" font-family="sans-serif" font-size="9" font-weight="600">RECENT TRANSFERS</text>

  <rect x="330" y="335" width="180" height="36" rx="6" fill="#16161a" />
  <text x="340" y="352" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="500">Aethelgard Corp</text>
  <text x="340" y="364" fill="#666666" font-family="monospace" font-size="8">Today, 14:22</text>
  <text x="495" y="357" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="end">-$4,200</text>

  <rect x="330" y="376" width="180" height="36" rx="6" fill="#16161a" />
  <text x="340" y="393" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="500">Stripe Ingress</text>
  <text x="340" y="405" fill="#666666" font-family="monospace" font-size="8">Yesterday</text>
  <text x="495" y="398" fill="#44cc88" font-family="monospace" font-size="10" text-anchor="end">+$18,500</text>

  <!-- Home Indicator Bar -->
  <rect x="385" y="435" width="70" height="3" rx="1.5" fill="#ffffff" />

  <!-- Right Side Context Info -->
  <rect x="560" y="110" width="190" height="260" rx="8" fill="#121216" stroke="rgba(255,255,255,0.08)" />
  <text x="580" y="145" fill="#777777" font-family="monospace" font-size="9" letter-spacing="1">DEVICE RUNTIME</text>
  <text x="580" y="175" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="600">Cold Start &lt; 1.2s</text>
  <text x="580" y="195" fill="#888888" font-family="sans-serif" font-size="11">Native Hermes engine bytecode execution with zero JIT lag.</text>

  <rect x="580" y="225" width="150" height="1" fill="rgba(255,255,255,0.08)" />

  <text x="580" y="255" fill="#777777" font-family="monospace" font-size="9">GESTURE FIDELITY</text>
  <text x="580" y="275" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="500">120Hz ProMotion Sync</text>
  <text x="580" y="295" fill="#888888" font-family="sans-serif" font-size="11">Haptic trigger curves mapped to physical touch pressure.</text>
</svg>
