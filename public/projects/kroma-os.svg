<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="kromaGlow" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="#0c0c0e" />
  <rect width="800" height="480" fill="url(#kromaGlow)" />

  <!-- Window Container -->
  <rect x="30" y="30" width="740" height="420" rx="10" fill="#121215" stroke="rgba(255,255,255,0.14)" stroke-width="1" />

  <!-- Top Bar -->
  <rect x="30" y="30" width="740" height="40" rx="10" fill="#18181c" />
  <rect x="30" y="69" width="740" height="1" fill="rgba(255,255,255,0.08)" />

  <!-- Window Dots -->
  <circle cx="55" cy="50" r="4.5" fill="#3a3a3a" />
  <circle cx="70" cy="50" r="4.5" fill="#3a3a3a" />
  <circle cx="85" cy="50" r="4.5" fill="#3a3a3a" />

  <text x="110" y="54" fill="#888888" font-family="monospace" font-size="11" letter-spacing="0.5">KROMA_OS // TELEMETRY CORE v2.4</text>
  <rect x="660" y="42" width="90" height="18" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="672" cy="51" r="3" fill="#ffffff" />
  <text x="682" y="54" fill="#e0e0e0" font-family="monospace" font-size="9" letter-spacing="0.5">LIVE 60FPS</text>

  <!-- Sidebar -->
  <rect x="30" y="70" width="160" height="380" fill="#101013" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <text x="50" y="105" fill="#666666" font-family="monospace" font-size="10" letter-spacing="1">SYSTEM CLUSTERS</text>

  <rect x="45" y="120" width="130" height="26" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" />
  <text x="58" y="137" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="500">Node Cluster Alpha</text>

  <rect x="45" y="154" width="130" height="26" rx="4" fill="transparent" />
  <text x="58" y="171" fill="#777777" font-family="sans-serif" font-size="11">Edge Ingress (Tokyo)</text>

  <rect x="45" y="188" width="130" height="26" rx="4" fill="transparent" />
  <text x="58" y="205" fill="#777777" font-family="sans-serif" font-size="11">Edge Ingress (Frankfurt)</text>

  <rect x="45" y="222" width="130" height="26" rx="4" fill="transparent" />
  <text x="58" y="239" fill="#777777" font-family="sans-serif" font-size="11">Data Pipeline V3</text>

  <!-- Main Content Dashboard -->
  <!-- Stat Card 1 -->
  <rect x="210" y="90" width="170" height="75" rx="6" fill="#16161a" stroke="rgba(255,255,255,0.08)" />
  <text x="225" y="112" fill="#777777" font-family="monospace" font-size="9" letter-spacing="0.5">THROUGHPUT</text>
  <text x="225" y="142" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="600">842,190 <tspan font-size="10" fill="#888888">ops/s</tspan></text>

  <!-- Stat Card 2 -->
  <rect x="395" y="90" width="170" height="75" rx="6" fill="#16161a" stroke="rgba(255,255,255,0.08)" />
  <text x="410" y="112" fill="#777777" font-family="monospace" font-size="9" letter-spacing="0.5">P99 LATENCY</text>
  <text x="410" y="142" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="600">0.82 <tspan font-size="10" fill="#888888">ms</tspan></text>

  <!-- Stat Card 3 -->
  <rect x="580" y="90" width="170" height="75" rx="6" fill="#16161a" stroke="rgba(255,255,255,0.08)" />
  <text x="595" y="112" fill="#777777" font-family="monospace" font-size="9" letter-spacing="0.5">ACTIVE WORKERS</text>
  <text x="595" y="142" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="600">128 <tspan font-size="10" fill="#888888">threads</tspan></text>

  <!-- Large Wave Chart Panel -->
  <rect x="210" y="180" width="540" height="250" rx="8" fill="#141418" stroke="rgba(255,255,255,0.09)" />
  <text x="230" y="210" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Telemetry Stream Telemetry Waveform</text>
  <text x="230" y="226" fill="#666666" font-family="monospace" font-size="10">WebGL 2.0 Real-time Shaders Active</text>

  <!-- Grid lines in chart -->
  <line x1="230" y1="260" x2="730" y2="260" stroke="rgba(255,255,255,0.04)" />
  <line x1="230" y1="310" x2="730" y2="310" stroke="rgba(255,255,255,0.04)" />
  <line x1="230" y1="360" x2="730" y2="360" stroke="rgba(255,255,255,0.04)" />
  <line x1="230" y1="400" x2="730" y2="400" stroke="rgba(255,255,255,0.06)" />

  <!-- Area Fill -->
  <path d="M 230 400 L 230 340 Q 280 290 340 330 T 450 280 T 560 310 T 670 250 L 730 270 L 730 400 Z" fill="url(#chartGrad)" />
  <!-- Wave Path -->
  <path d="M 230 340 Q 280 290 340 330 T 450 280 T 560 310 T 670 250 L 730 270" fill="none" stroke="#ffffff" stroke-width="2.5" />

  <!-- Data Points -->
  <circle cx="340" cy="330" r="4" fill="#ffffff" stroke="#121215" stroke-width="2" />
  <circle cx="450" cy="280" r="4" fill="#ffffff" stroke="#121215" stroke-width="2" />
  <circle cx="560" cy="310" r="4" fill="#ffffff" stroke="#121215" stroke-width="2" />
  <circle cx="670" cy="250" r="5" fill="#ffffff" stroke="#121215" stroke-width="2" />

  <!-- Tooltip on peak -->
  <rect x="635" y="215" width="70" height="24" rx="4" fill="#ffffff" />
  <text x="670" y="231" fill="#080808" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">99.98% OK</text>
</svg>
