<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="aethGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="#09090b" />
  <rect width="800" height="480" fill="url(#aethGlow)" />

  <!-- Architectural Browser Container -->
  <rect x="30" y="30" width="740" height="420" rx="10" fill="#111114" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Minimal Top Nav -->
  <rect x="30" y="30" width="740" height="50" rx="10" fill="#141418" />
  <line x1="30" y1="80" x2="770" y2="80" stroke="rgba(255,255,255,0.08)" />

  <!-- Nav Links -->
  <text x="60" y="60" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2">ÆTHELGARD</text>
  <text x="320" y="59" fill="#999999" font-family="sans-serif" font-size="11">Selected Monographs</text>
  <text x="460" y="59" fill="#999999" font-family="sans-serif" font-size="11">Spatial Philosophy</text>
  <text x="590" y="59" fill="#999999" font-family="sans-serif" font-size="11">Archive Index</text>

  <!-- Main Editorial Layout -->
  <!-- Left Column: Typography & Context -->
  <text x="60" y="130" fill="#666666" font-family="monospace" font-size="10" letter-spacing="2">PROJECT ARCHIVE // VOL. 04</text>
  <text x="60" y="170" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5">Pavilion of Void &amp; Mass</text>
  <text x="60" y="196" fill="#888888" font-family="sans-serif" font-size="13">Kyoto Contemporary Architecture Biennial</text>

  <rect x="60" y="225" width="280" height="1" fill="rgba(255,255,255,0.12)" />

  <text x="60" y="255" fill="#aaaaaa" font-family="sans-serif" font-size="11" line-height="1.6">
    <tspan x="60" dy="0">A study in monolithic concrete geometry, balancing</tspan>
    <tspan x="60" dy="18">brutalist mass with delicate natural daylight corridors.</tspan>
    <tspan x="60" dy="18">Constructed with high-precision cast materials.</tspan>
  </text>

  <rect x="60" y="330" width="130" height="34" rx="4" fill="#ffffff" />
  <text x="125" y="352" fill="#09090b" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Explore 3D Space →</text>

  <rect x="205" y="330" width="120" height="34" rx="4" fill="transparent" stroke="rgba(255,255,255,0.2)" />
  <text x="265" y="352" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Specifications</text>

  <!-- Right Column: 3D Wireframe Architectural Model -->
  <rect x="380" y="105" width="360" height="320" rx="8" fill="#141418" stroke="rgba(255,255,255,0.08)" />

  <!-- Grid Perspective Lines -->
  <line x1="400" y1="380" x2="720" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <line x1="430" y1="350" x2="690" y2="350" stroke="rgba(255,255,255,0.06)" />
  <line x1="460" y1="320" x2="660" y2="320" stroke="rgba(255,255,255,0.04)" />

  <!-- 3D Architectural Prisms Isometric Wireframe -->
  <!-- Base Ground Shadow -->
  <polygon points="560,370 660,320 560,280 460,320" fill="rgba(255,255,255,0.02)" />

  <!-- Tower Block Left -->
  <polygon points="500,320 500,180 550,150 550,290" fill="#1a1a20" stroke="#ffffff" stroke-width="1.5" />
  <polygon points="550,290 550,150 620,185 620,325" fill="#22222a" stroke="#ffffff" stroke-width="1.5" />
  <polygon points="500,180 550,150 620,185 570,215" fill="#2e2e38" stroke="#ffffff" stroke-width="1.5" />

  <!-- Cantilever Slab -->
  <polygon points="460,250 580,190 680,240 560,300" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="2" />

  <!-- Floor Wireframe Cutouts -->
  <line x1="515" y1="230" x2="540" y2="215" stroke="rgba(255,255,255,0.5)" stroke-width="1" />
  <line x1="515" y1="260" x2="540" y2="245" stroke="rgba(255,255,255,0.5)" stroke-width="1" />
  <line x1="570" y1="235" x2="605" y2="250" stroke="rgba(255,255,255,0.5)" stroke-width="1" />

  <!-- Dimension Indicator Tag -->
  <rect x="630" y="125" width="90" height="22" rx="4" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" />
  <circle cx="642" cy="136" r="3" fill="#ffffff" />
  <text x="652" y="140" fill="#ffffff" font-family="monospace" font-size="9">3D ROTATE</text>
</svg>
