<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="monoGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="#09090b" />
  <rect width="800" height="480" fill="url(#monoGlow)" />

  <!-- Storefront Browser Container -->
  <rect x="30" y="30" width="740" height="420" rx="10" fill="#111114" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Minimal Store Nav -->
  <rect x="30" y="30" width="740" height="50" rx="10" fill="#141418" />
  <line x1="30" y1="80" x2="770" y2="80" stroke="rgba(255,255,255,0.08)" />

  <text x="60" y="60" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="3">MONOLITH</text>
  <text x="310" y="59" fill="#999999" font-family="sans-serif" font-size="11">Objects &amp; Furniture</text>
  <text x="440" y="59" fill="#999999" font-family="sans-serif" font-size="11">Editions</text>
  <text x="520" y="59" fill="#999999" font-family="sans-serif" font-size="11">Stockists</text>

  <rect x="680" y="44" width="60" height="24" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)" />
  <text x="710" y="60" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">BAG (0)</text>

  <!-- Hero Product Showcase Grid -->
  <!-- Left Side: Featured Object 01 -->
  <rect x="60" y="105" width="310" height="320" rx="8" fill="#16161b" stroke="rgba(255,255,255,0.08)" />

  <!-- Minimalist Geometric Product Render: Anodized Aluminum Luminaire -->
  <circle cx="215" cy="220" r="70" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
  <circle cx="215" cy="220" r="35" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="215" y1="130" x2="215" y2="310" stroke="#ffffff" stroke-width="2" />
  <rect x="195" y="215" width="40" height="10" rx="2" fill="#ffffff" />

  <text x="80" y="380" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">Alabaster Column Luminaire</text>
  <text x="80" y="400" fill="#888888" font-family="monospace" font-size="11">Series 01 // Edition of 50</text>
  <text x="345" y="385" fill="#ffffff" font-family="monospace" font-size="13" font-weight="600" text-anchor="end">$1,450</text>

  <!-- Right Side: Product 02 & Product 03 -->
  <!-- Product 02 -->
  <rect x="390" y="105" width="350" height="150" rx="8" fill="#16161b" stroke="rgba(255,255,255,0.08)" />
  <!-- Graphic Object: Cast Bronze Vessel -->
  <polygon points="460,180 500,180 515,220 445,220" fill="#2a2a34" stroke="#ffffff" stroke-width="1.5" />
  <ellipse cx="480" cy="180" rx="20" ry="6" fill="#353542" stroke="#ffffff" stroke-width="1.5" />

  <text x="540" y="155" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Cast Iron Ritual Vessel</text>
  <text x="540" y="175" fill="#888888" font-family="monospace" font-size="10">Sand-cast in Ishikawa, Japan</text>
  <text x="540" y="210" fill="#ffffff" font-family="monospace" font-size="12" font-weight="600">$420</text>

  <!-- Product 03 -->
  <rect x="390" y="275" width="350" height="150" rx="8" fill="#16161b" stroke="rgba(255,255,255,0.08)" />
  <!-- Graphic Object: Matte Obsidian Desk Object -->
  <rect x="445" y="330" width="60" height="40" rx="4" fill="#24242e" stroke="#ffffff" stroke-width="1.5" />
  <line x1="445" y1="350" x2="505" y2="350" stroke="rgba(255,255,255,0.4)" stroke-dasharray="2 2" />

  <text x="540" y="325" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Precision Tactile Weight</text>
  <text x="540" y="345" fill="#888888" font-family="monospace" font-size="10">Solid Titanium billet CNC-milled</text>
  <text x="540" y="380" fill="#ffffff" font-family="monospace" font-size="12" font-weight="600">$180</text>
</svg>
